name: PreconNative
options:
  bundleIdPrefix: com.brasfieldgorrie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PreconNative:
    type: application
    platform: iOS
    sources:
      - path: PreconNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brasfieldgorrie.precon.native
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Precon
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_NAME: PreconNative
    info:
      path: PreconNative/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleDisplayName: Precon
  PreconNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PreconNativeTests
    dependencies:
      - target: PreconNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brasfieldgorrie.precon.native.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  PreconNative:
    build:
      targets:
        PreconNative: all
        PreconNativeTests: [test]
    test:
      targets:
        - PreconNativeTests
